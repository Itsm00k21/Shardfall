<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"><rect x="0" y="0" width="1200" height="420" rx="0" fill="rgb(16,14,24)"/><rect x="20" y="20" width="373" height="380" rx="12" fill="rgb(28,24,40)" stroke="rgb(255,196,64)" stroke-width="2"/><text x="36" y="50" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="17" font-weight="800" fill="rgb(255,196,64)" text-anchor="start">A · Chip + stroke</text><text x="36" y="72" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="400" fill="rgb(176,168,198)" text-anchor="start">HARD chip + 2 px red strokes on your own</text><text x="36" y="88" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="400" fill="rgb(176,168,198)" text-anchor="start">dock, pad ring, wave chip, boss bar, results</text><rect x="60" y="110" width="293" height="220" rx="8" fill="rgb(50,26,42)"/><rect x="72" y="122" width="120" height="34" rx="8" fill="rgb(28,24,40)" stroke="rgb(230,80,96)" stroke-width="2"/><rect x="78" y="130" width="32" height="14" rx="7.0" fill="rgb(230,80,96)"/><text x="94.0" y="139.88" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="8" font-weight="800" fill="rgb(32,22,10)" text-anchor="middle">HARD</text><text x="116" y="143" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="800" fill="rgb(240,236,248)" text-anchor="start">WAVE 3/5</text><rect x="72" y="286" width="269" height="34" rx="8" fill="rgb(28,24,40)" stroke="rgb(255,196,64)" stroke-width="1"/><rect x="170" y="291" width="70" height="24" rx="6" fill="rgb(74,28,40)" stroke="rgb(255,196,64)" stroke-width="2"/><text x="205" y="307" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="rgb(255,170,180)" text-anchor="middle">Hard</text><