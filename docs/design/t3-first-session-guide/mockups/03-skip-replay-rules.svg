<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Builder Sans, Arial, sans-serif">
<title>T3 step ladder and skip/replay rules</title>
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A1846"/><stop offset="1" stop-color="#4A3A6A"/></linearGradient><linearGradient id="roll" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD678"/><stop offset="1" stop-color="#FFAA28"/></linearGradient><linearGradient id="leg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FFC440" stop-opacity="1"/><stop offset="0.7" stop-color="#FFE0A0" stop-opacity="0.9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient><linearGradient id="epic" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#BA60F0" stop-opacity="1"/><stop offset="0.7" stop-color="#DDB0F8" stop-opacity="0.9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient></defs>
<rect x="0" y="0" width="1000" height="620" rx="0" fill="#100E18" opacity="1"/><text x="24" y="40" font-size="20" fill="#FFD678" font-weight="700" text-anchor="start">T3 first-session guide · step ladder, skip / collapse / replay</text><line x1="40" y1="110" x2="960" y2="110" stroke="#B0A8C6" stroke-width="2"/><line x1="40.0" y1="104" x2="40.0" y2="116" stroke="#B0A8C6"/><text x="40.0" y="132" font-size="11" fill="#B0A8C6" font-weight="400" text-anchor="middle">0:00</text><line x1="270.0" y1="104" x2="270.0" y2="116" stroke="#B0A8C6"/><text x="270.0" y="132" font-size="11" fill="#B0A8C6" font-weight="400" text-anchor="middle">0:30</text><line x1="500.0" y1="104" x2="500.0" y2="116" stroke="#B0A8C6"/><text x="500.0" y="132" font-size="11" fill="#B0A8C6" font-weight="400" text-anchor="middle">1:00</text><line x1="730.0" y1="104" x2="730.0" y2="116" stroke="#B0A8C6"/><text x="730.0" y="132" font-size="11" fill="#B0A8C6" font-weight="400" text-anchor="middle">1:30</text><line x1="960.0" y1="104" x2="960.0" y2="116" stroke="#B0A8C6"/><text x="960.0" y="132" font-size="11" fill="#B0A8C6" font-weight="400" text-anchor="middle">2:00</text><line x1="960" y1="70" x2="960" y2="150" stroke="#E65060" stroke-width="3"/><text x="956" y="66" font-size="12" fill="#E65060" font-weight="700" text-anchor="end">2:00 hard target</text><rect x="40.0" y="80" width="6" height="20" rx="4" fill="#B0A8C6" opacity="1"/><rect x="45.36666666666667" y="80" width="17.633333333333333" height="20" rx="4" fill="#488EFF" opacity="1"/><rect x="63.0" y="80" width="15.333333333333334" height="20" rx="4" fill="#488EFF" opacity="1"/><rect x="78.33333333333334" y="80" width="23.0" height="20" rx="4" fill="#488EFF" opacity="1"/><rect x="109.0" y="80" width="46.0" height="20" rx="4" fill="#78D2FF" opacity="1"/><text x="40" y="72" font-size="12" fill="#F0ECF8" font-weight="700" text-anchor="start">typical ≈ 15 s to the pad</text><rect x="40" y="144" width="544.3333333333334" height="14" rx="4" fill="#6ED28C" opacity="0.6"/><text x="592.3333333333334" y="156" font-size="12" fill="#6ED28C" font-weight="700" text-anchor="start">worst case following only the last hint ≈ 71 s</text><rect x="24" y="200" width="232" height="250" rx="10" fill="#1C1828" opacity="1" stroke="#FFC440" stroke-width="1"/><text x="36" y="226" font-size="14" fill="#FFD678" font-weight="700" text-anchor="start">Steps (onboardStep)</text><text x="36" y="252" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">0 open — "Crack your first shard."</text><text x="36" y="268" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">1 roll1 — Crack shard 1 (FREE ×3)</text><text x="36" y="284" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">2 roll2 — Crack shard 2</text><text x="36" y="300" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">3 roll3 — Crack shard 3, ≥ Rare</text><text x="36" y="316" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">4 gate — Step on the Gate</text><text x="36" y="332" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">   ← PASS POINT</text><text x="36" y="348" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">5 wave1 — Clear wave 1 (#412)</text><text x="36" y="364" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">   → onboardDone</text><text x="36" y="380" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">Goals tab stays "Goals N/5" (live)</text><rect x="268" y="200" width="232" height="250" rx="10" fill="#1C1828" opacity="1" stroke="#FFC440" stroke-width="1"/><text x="280" y="226" font-size="14" fill="#FFD678" font-weight="700" text-anchor="start">Idle ladder (per step)</text><text x="280" y="252" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">+4 s  pointer hand on ROLL</text><text x="280" y="268" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">+9 s  Wren repeats once</text><text x="280" y="284" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">+6 s  edge arrow (Gate off-screen)</text><text x="280" y="300" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">+30 s  "Take me there" (gate step)</text><text x="280" y="316" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">covered by a menu → timers pause</text><text x="280" y="332" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">no fail state, no nag loop</text><rect x="512" y="200" width="232" height="250" rx="10" fill="#1C1828" opacity="1" stroke="#FFC440" stroke-width="1"/><text x="524" y="226" font-size="14" fill="#FFD678" font-weight="700" text-anchor="start">Skip / collapse</text><text x="524" y="252" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">Skip intro: card, steps open–gate</text><text x="524" y="268" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">one tap, closes on press (live)</text><text x="524" y="284" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">= same kit + unused rolls as tokens</text><text x="524" y="300" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">after skip: Gate Beam stays</text><text x="524" y="316" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">Chevron 44 hit: card ↔ pill (session)</text><text x="524" y="332" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">menus hide card + pill (coverWhen)</text><rect x="756" y="200" width="232" height="250" rx="10" fill="#1C1828" opacity="1" stroke="#FFC440" stroke-width="1"/><text x="768" y="226" font-size="14" fill="#FFD678" font-weight="700" text-anchor="start">Replay (new, client-only)</text><text x="768" y="252" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">Settings → "Replay guide" (44 tall)</text><text x="768" y="268" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">only if onboardDone + in hub</text><text x="768" y="284" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">points only: Crackstone, then Gate</text><text x="768" y="300" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">no free rolls, no kit, no save write</text><text x="768" y="316" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">ends: pad / Stop replay / leave</text><text x="768" y="332" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">never auto-starts</text><text x="24" y="486" font-size="14" fill="#FFD678" font-weight="700" text-anchor="start">Placement notes</text><text x="24" y="508" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">390×844: card (16,103) 358×112 · chip (16,223) · ROLL bar (95,700) 200×56 · keep-out x 117–273, y 296–616</text><text x="24" y="524" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">667×375: card/pill (100,6) in FocusTop · Goals tab right edge y 60 · ROLL (233,315) 200×48 · edge arrow y 120–260</text><text x="24" y="540" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">800×400: as 667×375, ROLL (300,336), edge arrow y 120–280 · keep-out x 240–560, y 112–292</text><text x="24" y="556" font-size="12" fill="#F0ECF8" font-weight="400" text-anchor="start">Desktop 1280×720: live card (24,24) 460×144 · chip (24,180) · ROLL (540,640) 200×56 · "Click ROLL or press R."</text>
</svg>
