<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440"><rect x="0" y="0" width="1200" height="440" rx="0" fill="rgb(16,14,24)"/><text x="24" y="40" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="17" font-weight="800" fill="rgb(240,236,248)" text-anchor="start">Telegraph timelines (numbers from Shared/Config/Enemies.luau on #431, e7abb8e)</text><text x="24" y="80" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="14" font-weight="800" fill="rgb(255,196,64)" text-anchor="start">SHARD VOLLEY · VOLLEY_WINDUP 0.9 s → 3 shots (spread 0.12 rad, 64 studs/s) → VOLLEY_COOLDOWN 5 s</text><rect x="24" y="92" width="1152" height="26" rx="6" fill="rgb(28,24,40)" stroke="rgb(40,34,58)" stroke-width="1"/><rect x="24.0" y="92" width="540.0" height="26" rx="4" fill="rgb(255,120,40)" opacity="0.85"/><text x="30.0" y="110" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="800" fill="rgb(32,22,10)" text-anchor="start">lanes grow + track target · gem charges · cue in boss bar</text><rect x="564.0" y="92" width="108.00000000000001" height="26" rx="4" fill="rgb(255,244,230)" opacity="0.85"/><text x="570.0" y="110" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="800" fill="rgb(32,22,10)" text-anchor="start">flash</text><rect x="672.0" y="92" width="288.0" height="26" rx="4" fill="rgb(40,34,58)" opacity="0.85"/><text x="678.0" y="110" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="800" fill="rgb(240,236,248)" text-anchor="start">bolts in flight (~0.4 s at 24 studs)</text><line x1="24.0" y1="86" x2="24.0" y2="128" stroke="rgb(240,236,248)" stroke-width="1.5"/><text x="28.0" y="140" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="rgb(176,168,198)" text-anchor="start">pressure armed + outside melee (range 9)</text><line x1="672.0" y1="86" x2="672.0" y2="128" stroke="rgb(240,236,248)" stroke-width="1.5"/><text x="676.0" y="140" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="rgb(176,168,198)" text-anchor="start">fire: lead computed now</text><line x1="960.0" y1="86" x2="960.0" y2="128" stroke="rgb(240,236,248)" stroke-width="1.5"/><text x="964.0" y="140" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="rgb(176,168,198)" text-anchor="start">hit check</text><text x="24.0" y="158" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="9" font-weight="400" fill="rgb(176,168,198)" text-anchor="middle">0.0s</text><text x="240.0" y="158" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="9" font-weight="400" fill="rgb(176,168,198)" text-anchor="middle">0.3s</text><text x="456.0" y="158" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="9" font-weight="400" fill="rgb(176,168,198)" text-anchor="middle">0.6s</text><text x="672.0" y="158" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="9" font-weight="400" fill="rgb(176,168,198)" text-anchor="middle">0.9s</text><text x="888.0" y="158" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="9" font-weight="400" fill="rgb(176,168,198)" text-anchor="middle">1.2s</text><text x="1104.0" y="158" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="9" font-weight="400" fill="rgb(176,168,198)" text-anchor="middle">1.5s</text><text x="24" y="200" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="14" font-weight="800" fill="rgb(255,196,64)" text-anchor="start">LEASH SLAM · after 3 s beyond 24 studs → LEASH_WINDUP 1.2 s, mark radius 4, dash 40 studs/s</text><rect x="24" y="212" width="1152" height="26" rx="6" fill="rgb(28,24,40)" stroke="rgb(40,34,58)" stroke-width="1"/><rect x="24.0" y="212" width="864.0" height="26" rx="4" fill="rgb(255,120,40)" opacity="0.85"/><text x="30.0" y="230" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="800" fill="rgb(32,22,10)" text-anchor="start">ring + rim ticks stay · inner fill grows 0 → rim · dash beam + trail</text><rect x="888.0" y="212" width="180.0" height="26" rx="4" fill="rgb(255,244,230)" opacity="0.85"/><text x="894.0" y="230" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="800" fill="rgb(32,22,10)" text-anchor="start">impact</text><line x1="24.0" y1="206" x2="24.0" y2="248" stroke="rgb(240,236,248)" stroke-width="1.5"/><text x="28.0" y="260" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="rgb(176,168,198)" text-anchor="start">mark placed at your feet</text><line x1="456.0" y1="206" x2="456.0" y2="248" stroke="rgb(240,236,248)" stroke-width="1.5"/><text x="460.0" y="260" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="rgb(176,168,198)" text-anchor="start">boss usually arrives (24 studs ÷ 40)</text><line x1="888.0" y1="206" x2="888.0" y2="248" stroke="rgb(240,236,248)" stroke-width="1.5"/><text x="892.0" y="260" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="rgb(176,168,198)" text-anchor="start">lands if you're inside 4 studs</text><text x="24.0" y="278" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="9" font-weight="400" fill="rgb(176,168,198)" text-anchor="middle">0.0s</text><text x="240.0" y="278" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="9" font-weight="400" fill="rgb(176,168,198)" text-anchor="middle">0.3s</text><text x="456.0" y="278" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="9" font-weight="400" fill="rgb(176,168,198)" text-anchor="middle">0.6s</text><text x="672.0" y="278" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="9" font-weight="400" fill="rgb(176,168,198)" text-anchor="middle">0.9s</text><text x="888.0" y="278" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="9" font-weight="400" fill="rgb(176,168,198)" text-anchor="middle">1.2s</text><text x="1104.0" y="278" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="9" font-weight="400" fill="rgb(176,168,198)" text-anchor="middle">1.5s</text><text x="24" y="322" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="rgb(240,236,248)" text-anchor="start">Blocked dash path: the mark cancels → ring turns gray dashed and fades in 0.15 s (fizzle). A live mark pauses the volley windup (it resumes after).</text><text x="24" y="344" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="rgb(240,236,248)" text-anchor="start">Hard (#430): enemies 2× HP, 1.5× damage. Telegraph timings and colors are the same on every tier.</text><rect x="24" y="369" width="10" height="10" rx="2" fill="rgb(255,120,40)"/><text x="40" y="378" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="rgb(240,236,248)" text-anchor="start">threat orange 255,120,40 (telegraph body)</text><rect x="24" y="385" width="10" height="10" rx="2" fill="rgb(255,244,230)"/><text x="40" y="394" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="rgb(240,236,248)" text-anchor="start">flash white 255,244,230 (edges + last 0.15 s)</text><rect x="24" y="401" width="10" height="10" rx="2" fill="rgb(150,150,160)"/><text x="40" y="410" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="rgb(240,236,248)" text-anchor="start">fizzle gray 150,150,160 (cancelled)</text></svg>