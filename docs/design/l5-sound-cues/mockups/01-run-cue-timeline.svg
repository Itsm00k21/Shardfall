<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760"><rect x="0" y="0" width="1280" height="760" rx="0" fill="#100E18" opacity="1"/><text x="30" y="40" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="18" font-weight="800" fill="#F0ECF8" text-anchor="start">L5 RUN CUE TIMELINE v1 · one run, cue lanes (fake timing, not to scale between segments)</text><text x="30" y="62" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="400" fill="#B0A8C6" text-anchor="start">Bar length = cue length · color = priority (gold 1 never dropped · blue 2 · gray 3 · dim 4). Ids are Audio.CUES keys or UiSfx actions.</text><rect x="30" y="80" width="250" height="26" rx="4" fill="#28243A" opacity="1"/><text x="155.0" y="98" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="#F0ECF8" text-anchor="middle">HUB + ROLL</text><rect x="290" y="80" width="150" height="26" rx="4" fill="#28243A" opacity="1"/><text x="365.0" y="98" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="#F0ECF8" text-anchor="middle">WAVE START</text><rect x="450" y="80" width="250" height="26" rx="4" fill="#28243A" opacity="1"/><text x="575.0" y="98" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="#F0ECF8" text-anchor="middle">FIGHT</text><rect x="710" y="80" width="150" height="26" rx="4" fill="#28243A" opacity="1"/><text x="785.0" y="98" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="#F0ECF8" text-anchor="middle">WAVE CLEAR</text><rect x="870" y="80" width="380" height="26" rx="4" fill="#28243A" opacity="1"/><text x="1060.0" y="98" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="#F0ECF8" text-anchor="middle">BOSS WAVE</text><text x="30" y="136" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="800" fill="#78D2FF" text-anchor="start">UI (UiSfx)</text><line x1="30" y1="170" x2="1250" y2="170" stroke="#28243A"/><text x="30" y="206" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="800" fill="#78D2FF" text-anchor="start">Roll</text><line x1="30" y1="240" x2="1250" y2="240" stroke="#28243A"/><text x="30" y="276" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="800" fill="#78D2FF" text-anchor="start">Wave</text><line x1="30" y1="310" x2="1250" y2="310" stroke="#28243A"/><text x="30" y="346" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="800" fill="#78D2FF" text-anchor="start">Combat</text><line x1="30" y1="380" x2="1250" y2="380" stroke="#28243A"/><text x="30" y="416" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="800" fill="#78D2FF" text-anchor="start">Boss</text><line x1="30" y1="450" x2="1250" y2="450" stroke="#28243A"/><rect x="40" y="154" width="14" height="14" rx="3" fill="#488EFF" opacity="1"/><text x="40" y="150" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="#F0ECF8" text-anchor="start">press</text><rect x="90" y="154" width="14" height="14" rx="3" fill="#488EFF" opacity="1"/><text x="90" y="180" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="#F0ECF8" text-anchor="start">tab</text><rect x="140" y="154" width="20" height="14" rx="3" fill="#488EFF" opacity="1"/><text x="140" y="150" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="#F0ECF8" text-anchor="start">open</text><rect x="170" y="224" width="70" height="14" rx="3" fill="#5A5470" opacity="1"/><text x="170" y="250" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="#F0ECF8" text-anchor="start">reel_tick ×n (pitch rises)</text><rect x="245" y="224" width="40" height="14" rx="3" fill="#FFC440" opacity="1"/><text x="245" y="220" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="#F0ECF8" text-anchor="start">&lt;tier&gt;</text><rect x="300" y="294" width="120" height="14" rx="3" fill="#FFC440" opacity="1"/><text x="300" y="320" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="#F0ECF8" text-anchor="start">wave_start 0.8 s</text><rect x="460" y="364" width="20" height="14" rx="3" fill="#A8A8B0" opacity="1"/><text x="460" y="360" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="#F0ECF8" text-anchor="start">hit_ember</text><rect x="500" y="364" width="20" height="14" rx="3" fill="#A8A8B0" opacity="1"/><text x="500" y="390" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="#F0ECF8" text-anchor="start">hit_frost</text><rect x="540" y="364" width="20" height="14" rx="3" fill="#A8A8B0" opacity="1"/><text x="540" y="360" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="#F0ECF8" text-anchor="start">hit_void</text><rect x="575" y="364" width="16" height="14" rx="3" fill="#488EFF" opacity="1"/><text x="575" y="390" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="#F0ECF8" text-anchor="start">crit</text><rect x="610" y="364" width="20" height="14" rx="3" fill="#488EFF" opacity="1"/><text x="610" y="360" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="#F0ECF8" text-anchor="start">shield_block</text><rect x="660" y="364" width="20" height="14" rx="3" fill="#A8A8B0" opacity="1"/><text x="660" y="390" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="#F0ECF8" text-anchor="start">kill</text><rect x="680" y="154" width="16" height="14" rx="3" fill="#488EFF" opacity="1"/><text x="680" y="150" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="#F0ECF8" text-anchor="start">confirm</text><rect x="720" y="294" width="90" height="14" rx="3" fill="#FFC440" opacity="1"/><text x="720" y="320" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="#F0ECF8" text-anchor="start">wave_clear 1.2 s</text><rect x="820" y="294" width="26" height="14" rx="3" fill="#A8A8B0" opacity="1"/><text x="820" y="290" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="#F0ECF8" text-anchor="start">loot_collect</text><rect x="880" y="434" width="200" height="14" rx="3" fill="#FFC440" opacity="1"/><text x="880" y="460" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="#F0ECF8" text-anchor="start">boss_enter 4.5 s</text><rect x="1090" y="434" width="50" height="14" rx="3" fill="#FFC440" opacity="1"/><text x="1090" y="430" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="#F0ECF8" text-anchor="start">volley 0.9</text><rect x="1150" y="434" width="60" height="14" rx="3" fill="#FFC440" opacity="1"/><text x="1150" y="460" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="#F0ECF8" text-anchor="start">slam_windup 1.2</text><rect x="1212" y="434" width="18" height="14" rx="3" fill="#FFC440" opacity="1"/><text x="1212" y="430" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="#F0ECF8" text-anchor="start">impact</text><rect x="1100" y="364" width="20" height="14" rx="3" fill="#A8A8B0" opacity="1"/><text x="1100" y="390" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="#F0ECF8" text-anchor="start">hit</text><rect x="1180" y="294" width="60" height="14" rx="3" fill="#FFC440" opacity="1"/><text x="1180" y="290" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="#F0ECF8" text-anchor="start">boss_clear</text><text x="30" y="500" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="14" font-weight="800" fill="#F0ECF8" text-anchor="start">RARITY LADDER (roll reveal, Audio.cue(rarity)) · length × base volume · colors from Rarities.COLOR</text><text x="30" y="542" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="13" font-weight="800" fill="rgb(168, 168, 176)" text-anchor="start">Common</text><rect x="140" y="534" width="57.0" height="16" rx="3" fill="rgb(168, 168, 176)" opacity="1"/><text x="207.0" y="544" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="400" fill="#B0A8C6" text-anchor="start">0.15 s · vol 0.4 · click/pop</text><text x="30" y="584" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="13" font-weight="800" fill="rgb(64, 186, 98)" text-anchor="start">Uncommon</text><rect x="140" y="574" width="114.0" height="18" rx="3" fill="rgb(64, 186, 98)" opacity="1"/><text x="264.0" y="586" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="400" fill="#B0A8C6" text-anchor="start">0.3 s · vol 0.45 · light chime</text><text x="30" y="626" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="13" font-weight="800" fill="rgb(72, 142, 255)" text-anchor="start">Rare</text><rect x="140" y="612" width="228.0" height="22" rx="3" fill="rgb(72, 142, 255)" opacity="1"/><text x="378.0" y="628" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="400" fill="#B0A8C6" text-anchor="start">0.6 s · vol 0.55 · 2-note chime + shimmer</text><text x="30" y="668" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="13" font-weight="800" fill="rgb(186, 96, 240)" text-anchor="start">Epic</text><rect x="140" y="650" width="380.0" height="26" rx="3" fill="rgb(186, 96, 240)" opacity="1"/><text x="530.0" y="670" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="400" fill="#B0A8C6" text-anchor="start">1.0 s · vol 0.65 · arpeggio + bass · Music 40%</text><text x="30" y="710" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="13" font-weight="800" fill="rgb(255, 196, 64)" text-anchor="start">Legendary</text><rect x="140" y="688" width="684.0" height="30" rx="3" fill="rgb(255, 196, 64)" opacity="1"/><text x="834.0" y="712" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="400" fill="#B0A8C6" text-anchor="start">1.8 s · vol 0.75 · choir + impact + theme · Music 25%</text><text x="30" y="745" font-family="'Builder Sans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#78D2FF" text-anchor="start">x10 roll: ticks once, then only the best tier's cue once. Sound never replaces the tier word.</text></svg>