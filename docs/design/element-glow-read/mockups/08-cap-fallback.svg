<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect x="0" y="0" width="1200" height="520" rx="0" fill="rgb(16,14,24)"/><text x="24" y="36" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="15" font-weight="800" fill="rgb(240,236,248)" text-anchor="start">P2-432-1: Roblox draws at most 31 Highlights at once. Budget, priority and the visual fallback</text><rect x="24" y="56" width="1152" height="64" rx="10" fill="rgb(28,24,40)" stroke="rgb(40,34,58)" stroke-width="1"/><rect x="36" y="68" width="288.0967741935484" height="40" rx="6" fill="rgb(255,196,64)"/><text x="42" y="93" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="800" fill="rgb(32,22,10)" text-anchor="start">8 · alive enemies: glow OR warm Rim (1 each)</text><rect x="327.0967741935484" y="68" width="142.5483870967742" height="40" rx="6" fill="rgb(150,120,40)"/><text x="333.0967741935484" y="93" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="800" fill="rgb(240,236,248)" text-anchor="start">4 · + desktop/stress</text><rect x="472.6451612903226" y="68" width="142.5483870967742" height="40" rx="6" fill="rgb(120,170,255)"/><text x="478.6451612903226" y="93" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="800" fill="rgb(240,236,248)" text-anchor="start">4 · players / allies</text><rect x="618.1935483870968" y="68" width="106.16129032258065" height="40" rx="6" fill="rgb(186,96,240)"/><text x="624.1935483870968" y="93" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="800" fill="rgb(240,236,248)" text-anchor="start">3 · loot + boss</text><rect x="727.3548387096774" y="68" width="433.6451612903226" height="40" rx="6" fill="rgb(54,46,78)"/><text x="733.3548387096774" y="93" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="800" fill="rgb(240,236,248)" text-anchor="start">12 · headroom</text><text x="24" y="140" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="rgb(240,236,248)" text-anchor="start">Rule: every ALIVE enemy has exactly 1 Highlight (element glow OR the warm Rim, never both); a DEAD enemy has 0. Glow budget (Config knob, Echo names it): 6 on touch, 12 on desktop.</text><text x="24" y="160" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="rgb(240,236,248)" text-anchor="start">Who glows: first come, first served by spawn order. A slot frees on death and goes to the oldest alive enemy without a glow (one swap per frame).</text><text x="24" y="180" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="rgb(240,236,248)" text-anchor="start">Over budget = warm Rim (no extra Highlight). Boss: no element glow (keeps its Rim + telegraph read, Q5). Highlights in use ≈ alive enemies + players + loot, far under 31.</text><text x="24" y="220" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="13" font-weight="800" fill="rgb(255,196,64)" text-anchor="start">On death (fixes P2-432-1 + P3-432-1):</text><rect x="24" y="232" width="276" height="74" rx="10" fill="rgb(28,24,40)" stroke="rgb(40,34,58)" stroke-width="1"/><text x="36" y="254" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="rgb(255,196,64)" text-anchor="start">t 0.00</text><text x="36" y="274" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="rgb(240,236,248)" text-anchor="start">HP hits 0</text><text x="36" y="292" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="rgb(176,168,198)" text-anchor="start">server marks dead</text><rect x="314" y="232" width="276" height="74" rx="10" fill="rgb(28,24,40)" stroke="rgb(40,34,58)" stroke-width="1"/><text x="326" y="254" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="rgb(255,196,64)" text-anchor="start">t 0.00–0.15</text><text x="326" y="274" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="rgb(240,236,248)" text-anchor="start">Highlight Fill/Outline → 1</text><text x="326" y="292" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="rgb(176,168,198)" text-anchor="start">light Brightness → 0 (tween)</text><rect x="604" y="232" width="276" height="74" rx="10" fill="rgb(28,24,40)" stroke="rgb(40,34,58)" stroke-width="1"/><text x="616" y="254" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="rgb(255,196,64)" text-anchor="start">t 0.15</text><text x="616" y="274" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="rgb(240,236,248)" text-anchor="start">Destroy Highlight + light</text><text x="616" y="292" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="rgb(176,168,198)" text-anchor="start">slot freed, next enemy glows</text><rect x="894" y="232" width="276" height="74" rx="10" fill="rgb(28,24,40)" stroke="rgb(40,34,58)" stroke-width="1"/><text x="906" y="254" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="rgb(255,196,64)" text-anchor="start">t 0.15+</text><text x="906" y="274" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="rgb(240,236,248)" text-anchor="start">corpse fade as today</text><text x="906" y="292" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="600" fill="rgb(176,168,198)" text-anchor="start">no glow on the corpse</text><text x="24" y="340" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="13" font-weight="800" fill="rgb(255,196,64)" text-anchor="start">Visual fallback when an enemy has no glow slot:</text><rect x="24" y="352" width="560" height="140" rx="10" fill="rgb(64,56,84)" stroke="rgb(40,34,58)" stroke-width="1"/><ellipse cx="110" cy="460" rx="63.0" ry="20.16" fill="rgb(255,112,36)" opacity="0.22"/><rect x="89.0" y="390" width="42.0" height="70" rx="4" fill="rgb(110,120,100)" stroke="rgb(20,20,20)" stroke-width="1"/><rect x="97.4" y="404.0" width="8.4" height="7.0" rx="0" fill="rgb(255,220,120)"/><rect x="114.2" y="404.0" width="8.4" height="7.0" rx="0" fill="rgb(255,220,120)"/><rect x="89.0" y="390" width="42.0" height="70" rx="4" fill="rgb(255,112,36)" opacity="0.5"/><rect x="87.5" y="388.5" width="45.0" height="73" rx="5" fill="none" stroke="rgb(255,176,134)" stroke-width="2.2" stroke-opacity="1.0"/><rect x="78.5" y="376" width="63.0" height="6" rx="3" fill="rgb(20,16,28)"/><rect x="79.5" y="377" width="42.699999999999996" height="4" rx="2" fill="rgb(230,80,96)"/><polygon points="70.5,373 75.9,383.5 65.1,383.5" fill="rgb(255,112,36)" stroke="rgb(20,16,28)" stroke-width="1.2"/><text x="110" y="484" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="rgb(240,236,248)" text-anchor="middle">with slot</text><rect x="229.0" y="390" width="42.0" height="70" rx="4" fill="rgb(110,120,100)" stroke="rgb(20,20,20)" stroke-width="1"/><rect x="237.4" y="404.0" width="8.4" height="7.0" rx="0" fill="rgb(255,220,120)"/><rect x="254.2" y="404.0" width="8.4" height="7.0" rx="0" fill="rgb(255,220,120)"/><rect x="228.0" y="389" width="44.0" height="72" rx="5" fill="none" stroke="rgb(255,236,200)" stroke-width="1.4" stroke-opacity="0.8"/><rect x="218.5" y="376" width="63.0" height="6" rx="3" fill="rgb(20,16,28)" stroke="rgb(255,112,36)" stroke-width="1.2"/><rect x="219.5" y="377" width="42.699999999999996" height="4" rx="2" fill="rgb(230,80,96)"/><polygon points="210.5,373 215.9,383.5 205.1,383.5" fill="rgb(255,112,36)" stroke="rgb(20,16,28)" stroke-width="1.2"/><text x="250" y="484" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="700" fill="rgb(240,236,248)" text-anchor="middle">over cap</text><text x="320" y="390" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="rgb(240,236,248)" text-anchor="start">over cap keeps:</text><text x="320" y="410" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="rgb(176,168,198)" text-anchor="start">• element pip (shape + color) on the bar</text><text x="320" y="428" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="rgb(176,168,198)" text-anchor="start">• bar gets a 1 px element-color UIStroke</text><text x="320" y="446" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="rgb(176,168,198)" text-anchor="start">• warm Rim Highlight (as today), no light</text><text x="320" y="464" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="rgb(176,168,198)" text-anchor="start">• gains the glow when a slot frees</text><rect x="600" y="352" width="576" height="140" rx="10" fill="rgb(28,24,40)" stroke="rgb(40,34,58)" stroke-width="1"/><text x="612" y="376" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="12" font-weight="800" fill="rgb(240,236,248)" text-anchor="start">Pips (BillboardGui, always on, 12×12):</text><polygon points="640,408 650.8,429.0 629.2,429.0" fill="rgb(255,112,36)" stroke="rgb(20,16,28)" stroke-width="1.2"/><text x="660" y="425" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="800" fill="rgb(255,112,36)" text-anchor="start">Ember = flame</text><polygon points="810,408 819.6,420 810,432 800.4,420" fill="rgb(92,214,255)" stroke="rgb(20,16,28)" stroke-width="1.2"/><text x="830" y="425" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="800" fill="rgb(92,214,255)" text-anchor="start">Frost = crystal</text><circle cx="980" cy="420" r="10.2" fill="none" stroke="rgb(196,92,255)" stroke-width="6.0"/><circle cx="980" cy="420" r="13.2" fill="none" stroke="rgb(20,16,28)" stroke-width="1"/><text x="1000" y="425" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="800" fill="rgb(196,92,255)" text-anchor="start">Void = ring</text><text x="612" y="470" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="rgb(176,168,198)" text-anchor="start">Shape carries the element for colorblind players and over-cap enemies.</text></svg>