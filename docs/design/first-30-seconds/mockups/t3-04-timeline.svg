<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"><rect x="0" y="0" width="1200" height="360" rx="0" fill="rgb(16,14,24)"/><defs><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="white" stop-opacity="0.9"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient></defs><text x="20" y="34" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="16" font-weight="800" fill="rgb(240,236,248)" text-anchor="start">Wren's Trail: 5 steps, target ~1:40, hard cap 2:00 (Config GUIDE_MAX_SECONDS = 120)</text><rect x="60" y="120" width="1080" height="8" rx="4" fill="rgb(40,34,58)"/><rect x="60.0" y="120" width="108.0" height="8" rx="4" fill="rgb(255,196,64)"/><line x1="60.0" y1="128" x2="60.0" y2="146" stroke="rgb(255,196,64)" stroke-width="1"/><text x="62.0" y="160" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="13" font-weight="800" fill="rgb(255,196,64)" text-anchor="start">1 Crack 3 shards</text><text x="62.0" y="178" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="rgb(176,168,198)" text-anchor="start">3 free rolls, 3rd ≥ Rare (#412)</text><rect x="168.0" y="120" width="54.0" height="8" rx="4" fill="rgb(120,210,255)"/><line x1="168.0" y1="128" x2="168.0" y2="198" stroke="rgb(120,210,255)" stroke-width="1"/><text x="170.0" y="212" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="13" font-weight="800" fill="rgb(120,210,255)" text-anchor="start">2 Follow the arrow</text><text x="170.0" y="230" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="rgb(176,168,198)" text-anchor="start">Beam + edge arrow to the Gate</text><rect x="222.0" y="120" width="108.0" height="8" rx="4" fill="rgb(230,80,96)"/><line x1="222.0" y1="128" x2="222.0" y2="250" stroke="rgb(230,80,96)" stroke-width="1"/><text x="224.0" y="264" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="13" font-weight="800" fill="rgb(230,80,96)" text-anchor="start">3 First kill</text><text x="224.0" y="282" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="rgb(176,168,198)" text-anchor="start">wave 1 (#412)</text><rect x="330.0" y="120" width="270.0" height="8" rx="4" fill="rgb(186,96,240)"/><line x1="330.0" y1="128" x2="330.0" y2="146" stroke="rgb(186,96,240)" stroke-width="1"/><text x="332.0" y="160" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="13" font-weight="800" fill="rgb(186,96,240)" text-anchor="start">4 Pick a buff</text><text x="332.0" y="178" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="rgb(176,168,198)" text-anchor="start">first Shard Draft (#416)</text><rect x="600.0" y="120" width="360.0" height="8" rx="4" fill="rgb(110,210,140)"/><line x1="600.0" y1="128" x2="600.0" y2="198" stroke="rgb(110,210,140)" stroke-width="1"/><text x="602.0" y="212" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="13" font-weight="800" fill="rgb(110,210,140)" text-anchor="start">5 Clear wave 2</text><text x="602.0" y="230" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="rgb(176,168,198)" text-anchor="start">then the guide ends</text><text x="60.0" y="110" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="rgb(176,168,198)" text-anchor="middle">0:00</text><text x="330.0" y="110" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="rgb(176,168,198)" text-anchor="middle">0:30</text><text x="600.0" y="110" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="rgb(176,168,198)" text-anchor="middle">1:00</text><text x="870.0" y="110" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="rgb(176,168,198)" text-anchor="middle">1:30</text><text x="1140.0" y="110" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="rgb(176,168,198)" text-anchor="middle">2:00</text><line x1="1140.0" y1="96" x2="1140.0" y2="150" stroke="rgb(230,80,96)" stroke-width="2" stroke-dasharray="4 3"/><text x="1136.0" y="166" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="rgb(230,80,96)" text-anchor="end">cap</text><rect x="780" y="270" width="340" height="44" rx="22" fill="rgb(28,24,40)" stroke="rgb(255,196,64)" stroke-width="1.5"/><text x="950" y="298" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="13" font-weight="800" fill="rgb(255,196,64)" text-anchor="middle">You're ready, Seeker! Guide complete</text><text x="780" y="330" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="rgb(176,168,198)" text-anchor="start">toast lane (D3) at the end; pill fades, Goals tab keeps the rest</text></svg>