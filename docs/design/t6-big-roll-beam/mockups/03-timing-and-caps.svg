<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Builder Sans, Arial, sans-serif">
<title>T6 timing, caps, copy and budget</title>
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A1846"/><stop offset="1" stop-color="#4A3A6A"/></linearGradient><linearGradient id="roll" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD678"/><stop offset="1" stop-color="#FFAA28"/></linearGradient><linearGradient id="leg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FFC440" stop-opacity="1"/><stop offset="0.7" stop-color="#FFE0A0" stop-opacity="0.9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient><linearGradient id="epic" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#BA60F0" stop-opacity="1"/><stop offset="0.7" stop-color="#DDB0F8" stop-opacity="0.9"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient></defs>
<rect x="0" y="0" width="1000" height="620" rx="0" fill="#100E18" opacity="1"/><text x="24" y="40" font-size="20" fill="#FFD678" font-weight="700" text-anchor="start">T6 big-roll beam · timing, caps, copy, budget</text><rect x="60" y="120" width="156.0" height="26" rx="4" fill="#362E4E" opacity="1"/><text x="60" y="112" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">reveal (#397, Epic 1.30 / Leg 2.20)</text><rect x="240.0" y="120" width="42.000000000000014" height="26" rx="4" fill="#BA60F0" opacity="1"/><text x="240.0" y="112" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">rise 0.35</text><rect x="282.0" y="120" width="299.99999999999994" height="26" rx="4" fill="#BA60F0" opacity="1"/><text x="282.0" y="112" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">hold Epic 2.5 / Leg 3.5</text><rect x="582.0" y="120" width="48.00000000000004" height="26" rx="4" fill="#362E4E" opacity="1"/><text x="582.0" y="112" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">fade 0.4</text><rect x="750.0" y="120" width="41.99999999999996" height="26" rx="4" fill="#FFC440" opacity="1"/><text x="750.0" y="112" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">next queued (gap 1 s)</text><line x1="240.0" y1="90" x2="240.0" y2="170" stroke="#78D2FF" stroke-dasharray="4 3"/><text x="244.0" y="166" font-size="11" fill="#78D2FF" font-weight="400" text-anchor="start">server fires BigRoll at land + 0.2 s</text><text x="60" y="190" font-size="10" fill="#B0A8C6" font-weight="400" text-anchor="middle">0 s</text><text x="180" y="190" font-size="10" fill="#B0A8C6" font-weight="400" text-anchor="middle">1 s</text><text x="300" y="190" font-size="10" fill="#B0A8C6" font-weight="400" text-anchor="middle">2 s</text><text x="420" y="190" font-size="10" fill="#B0A8C6" font-weight="400" text-anchor="middle">3 s</text><text x="540" y="190" font-size="10" fill="#B0A8C6" font-weight="400" text-anchor="middle">4 s</text><text x="660" y="190" font-size="10" fill="#B0A8C6" font-weight="400" text-anchor="middle">5 s</text><text x="780" y="190" font-size="10" fill="#B0A8C6" font-weight="400" text-anchor="middle">6 s</text><text x="900" y="190" font-size="10" fill="#B0A8C6" font-weight="400" text-anchor="middle">7 s</text><rect x="24" y="230" width="232" height="250" rx="10" fill="#1C1828" opacity="1" stroke="#FFC440" stroke-width="1"/><text x="36" y="256" font-size="14" fill="#FFD678" font-weight="700" text-anchor="start">Spam caps (server)</text><text x="36" y="282" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">1 beam live server-wide</text><text x="36" y="297" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">queue cap 3, 1 s gap</text><text x="36" y="312" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">  overflow: chat line only</text><text x="36" y="327" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">chat ≤ 4 lines / 30 s</text><text x="36" y="342" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">  then "+N more big rolls."</text><text x="36" y="357" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">per player ≥ 8 s apart</text><text x="36" y="372" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">  (Epics merge into count)</text><text x="36" y="387" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">5 Epics in 60 s → line-only 60 s</text><text x="36" y="402" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">x10: one event, best tier + count</text><rect x="268" y="230" width="232" height="250" rx="10" fill="#1C1828" opacity="1" stroke="#FFC440" stroke-width="1"/><text x="280" y="256" font-size="14" fill="#FFD678" font-weight="700" text-anchor="start">Copy</text><text x="280" y="282" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">✦ {name} pulled an Epic {item}!</text><text x="280" y="297" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">★ {name} pulled a LEGENDARY</text><text x="280" y="312" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">  {item}!</text><text x="280" y="327" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">★ {name} pulled a LEGENDARY</text><text x="280" y="342" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">  and 2 Epics!</text><text x="280" y="357" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">toast (others):</text><text x="280" y="372" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">  ★ {name} pulled a Legendary!</text><text x="280" y="387" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">tag: {name} · LEGENDARY</text><text x="280" y="402" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">no odds, no buy link</text><rect x="512" y="230" width="232" height="250" rx="10" fill="#1C1828" opacity="1" stroke="#FFC440" stroke-width="1"/><text x="524" y="256" font-size="14" fill="#FFD678" font-weight="700" text-anchor="start">Phone budget / event</text><text x="524" y="282" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">≤ 2 Beams, Segments 1</text><text x="524" y="297" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">1 ParticleEmitter, Emit ≤ 28, Rate 0</text><text x="524" y="312" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">0 lights (LightEmission only)</text><text x="524" y="327" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">≤ 4 tweens, 1 BillboardGui</text><text x="524" y="342" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">≤ 0.5 ms/frame, ≥ 55 fps w/ 20 players</text><text x="524" y="357" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">low quality: core beam only</text><rect x="756" y="230" width="232" height="250" rx="10" fill="#1C1828" opacity="1" stroke="#FFC440" stroke-width="1"/><text x="768" y="256" font-size="14" fill="#FFD678" font-weight="700" text-anchor="start">Tiers + settings</text><text x="768" y="282" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">Epic 186,96,240  #BA60F0  · 60 st</text><text x="768" y="297" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">Legendary 255,196,64 #FFC440</text><text x="768" y="312" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">  80 st + ground ring</text><text x="768" y="327" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">Common/Uncommon/Rare: never</text><text x="768" y="342" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">hud.otherVfx off → line only</text><text x="768" y="357" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">graphics.vfx scales particles</text><text x="768" y="372" font-size="11" fill="#F0ECF8" font-weight="400" text-anchor="start">per-server, nothing saved (#413)</text><rect x="24" y="500" width="60" height="60" rx="10" fill="#BA60F0" opacity="1"/><text x="54" y="580" font-size="12" fill="#F0ECF8" font-weight="700" text-anchor="middle">Epic</text><rect x="100" y="500" width="60" height="60" rx="10" fill="#FFC440" opacity="1"/><text x="130" y="580" font-size="12" fill="#F0ECF8" font-weight="700" text-anchor="middle">Legendary</text><text x="190" y="520" font-size="12" fill="#B0A8C6" font-weight="400" text-anchor="start">Element colors (Ember #E84814, Frost #5CD6FF, Void #C04888) are not used in the column: one color = one tier.</text><text x="190" y="536" font-size="12" fill="#B0A8C6" font-weight="400" text-anchor="start">Beam fires only after the roller's reveal lands, so it never spoils a reveal.</text>
</svg>
