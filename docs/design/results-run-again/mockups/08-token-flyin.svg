s','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="900" fill="rgb(32,22,10)" text-anchor="middle">+5</text><circle cx="1090" cy="236" r="7" fill="rgb(255,196,64)" stroke="rgb(255,240,200)" stroke-width="1.2"/><polygon points="1090,231.8 1092.8,236 1090,240.2 1087.2,236" fill="rgb(32,22,10)" opacity="1"/><text x="24" y="340" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="14" font-weight="800" fill="rgb(255,196,64)" text-anchor="start">Timeline</text><rect x="24" y="352" width="1150" height="26" rx="6" fill="rgb(28,24,40)" stroke="rgb(40,34,58)" stroke-width="1"/><rect x="24.0" y="352" width="215.625" height="26" rx="4" fill="rgb(40,34,58)" opacity="0.9"/><text x="30.0" y="370" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="800" fill="rgb(240,236,248)" text-anchor="start">wings slide in (0.3 s)</text><rect x="239.625" y="352" width="553.4375" height="26" rx="4" fill="rgb(255,196,64)" opacity="0.9"/><text x="245.625" y="370" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="800" fill="rgb(32,22,10)" text-anchor="start">count-up 0.6 s · tokens fly 0.30–1.07 s (0.08 s stagger, 0.45 s each)</text><rect x="793.0625" y="352" width="273.12499999999994" height="26" rx="4" fill="rgb(108,78,196)" opacity="0.9"/><text x="799.0625" y="370" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="10" font-weight="800" fill="rgb(240,236,248)" text-anchor="start">+5 pop, ROLL settles</text><text x="24.0" y="396" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="9" font-weight="400" fill="rgb(176,168,198)" text-anchor="start">0.0s after wings start</text><text x="239.625" y="396" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="9" font-weight="400" fill="rgb(176,168,198)" text-anchor="middle">0.3s after wings start</text><text x="455.25" y="396" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="9" font-weight="400" fill="rgb(176,168,198)" text-anchor="middle">0.6s after wings start</text><text x="670.875" y="396" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="9" font-weight="400" fill="rgb(176,168,198)" text-anchor="middle">0.9s after wings start</text><text x="886.5" y="396" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="9" font-weight="400" fill="rgb(176,168,198)" text-anchor="middle">1.2s after wings start</text><text x="1102.125" y="396" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="9" font-weight="400" fill="rgb(176,168,198)" text-anchor="middle">1.5s after wings start</text><text x="24" y="424" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="rgb(240,236,248)" text-anchor="start">Plays only when RunResults.bossClear.granted is true (saved). Wipe, already-paid rejoin, or a failed save: no fly-in, no BOSS +5 chip. Tap anywhere: tokens snap to ROLL.</text><text x="24" y="442" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="rgb(176,168,198)" text-anchor="start">Reduced: if the ROLL button is off-screen (folded wings), tokens fly to the folded bar's token count instead.</text></svg>