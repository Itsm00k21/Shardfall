bossClear.granted</text><text x="822" y="143" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="rgb(240,236,248)" text-anchor="start">   is true (saved grant, Ghost Q6; Echo adds it).</text><text x="822" y="164" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="rgb(240,236,248)" text-anchor="start">2. Amount = bossClear.tokens (5 on every tier).</text><text x="822" y="185" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="rgb(240,236,248)" text-anchor="start">3. BOSS +5 chip: same gold outline on Hard;</text><text x="822" y="206" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="rgb(240,236,248)" text-anchor="start">   never red, never ×2.</text><text x="822" y="227" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="rgb(240,236,248)" text-anchor="start">4. Hard = the HARD badge on the stats wing title</text><text x="822" y="248" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="rgb(240,236,248)" text-anchor="start">   (+ the existing red 2 px wing stroke). Nothing</text><text x="822" y="269" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="rgb(240,236,248)" text-anchor="start">   else in the boss moment changes.</text><text x="822" y="290" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="rgb(240,236,248)" text-anchor="start">5. HARD ×2 tags stay on the clear tokens and</text><text x="822" y="311" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="rgb(240,236,248)" text-anchor="start">   fragments only; the tap caption splits the sum.</text><text x="822" y="332" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="rgb(240,236,248)" text-anchor="start">6. Flag off (hardMode): Normal only, no badge.</text><text x="24" y="400" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="rgb(176,168,198)" text-anchor="start">Gray-box. Colors PROVISIONAL (Kevin): accent 230,80,96, gold 255,196,64. Fake data. 390×844 layout = mockup 01; landscape/desktop = 04/06 (same rule).</text><text x="24" y="420" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="rgb(176,168,198)" text-anchor="start">Check: tokens line + chips fit 334 px at 390×844 (chip 52 px + tag 50 px + value); caption line 10 px, max 1 line.</text></svg>