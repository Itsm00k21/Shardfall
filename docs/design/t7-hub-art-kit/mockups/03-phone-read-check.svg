 text-anchor="start">1280×720 desktop: as landscape; Lumen Heart only when turning (it is behind the spawn camera).</text><text x="450" y="566" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="rgb(240,236,248)" text-anchor="start">Hollow lip band H16 reads as the gray edge on the horizon; nothing over 2 studs in the spawn triangle.</text><text x="450" y="590" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="rgb(240,236,248)" text-anchor="start">No screen UI added. World labels: BillboardGui text ≥ 18 px at 390 wide, MaxDistance 80 (Gate 96).</text><text x="450" y="614" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="12" font-weight="400" fill="rgb(240,236,248)" text-anchor="start">Prompts use the live ProximityPrompt tap button (≥ 44 px on touch, Quality.MIN_TAP).</text></svg>