24" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="rgb(176,168,198)" text-anchor="start">· N rift + both slabs visible at default zoom on 390×844; all 3 rifts on 667×375 / 800×400 / desktop.</text><text x="450" y="548" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="rgb(176,168,198)" text-anchor="start">· Slab 2.5 st &lt; chaser 3.4 st: the chaser head shows over cover (≥ 6 px at the far rift, L4 ladder).</text><text x="450" y="572" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="rgb(176,168,198)" text-anchor="start">· Hero (~5 st) always shows over cover; no camera occlusion handling needed.</text><text x="450" y="596" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="rgb(176,168,198)" text-anchor="start">· Keep-out (cyan) is a screen-UI rule; the kit adds no UI, so nothing new enters it.</text><text x="450" y="620" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="rgb(176,168,198)" text-anchor="start">· Rift lintels at 16 st stay under the top band on 667×375 at default zoom (Ghost checks rim zoom in Studio).</text><text x="450" y="644" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="rgb(176,168,198)" text-anchor="start">· Drain fans (gray) at each rift mouth read as 'color leaving' against the purple floor.</text><text x="450" y="668" font-family="'Builder Sans','BuilderSans','Inter','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="rgb(176,168,198)" text-anchor="start">· 800×400 and desktop 1280×720: same framing, wider; no change to the kit.</text></svg>