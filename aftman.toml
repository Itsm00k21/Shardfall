# Same tools as rokit.toml. Aftman is the older toolchain manager; Rokit is the
# successor and the one the README walks through first. Keep this file in sync
# with rokit.toml if you add a tool.
# Install: https://github.com/LPGhatguy/aftman  then `aftman install`

[tools]
rojo = "rojo-rbx/rojo@7.7.1"
wally = "UpliftGames/wally@0.3.2"
lune = "lune-org/lune@0.11.0"
stylua = "JohnnyMorganz/StyLua@2.6.0"
selene = "Kampfkarren/selene@0.32.0"
